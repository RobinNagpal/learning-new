# Deploys on every push to main:
#   web  → Expo static export synced to S3, then a CloudFront invalidation
#   api  → esbuild bundle rsynced to the shared Lightsail host, then a restart
#
# The API is a systemd service on a host shared with courtpot — one instance,
# one application per port — so the API half of this workflow uses SSH rather
# than AWS credentials. See deployment/README.md.
#
# Needs (created by deployment/terraform and .../shared-host, values in outputs):
#   secrets: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY  (the interestled-deployer user)
#            API_AWS_ACCESS_KEY_ID, API_AWS_SECRET_ACCESS_KEY
#                                                      (the interestled-api user, which can
#                                                       only read and write the audio bucket)
#            SSH_PRIVATE_KEY                           (the shared host's deploy user)
#            DATABASE_URL                              (same Postgres the API uses)
#            GEMINI_API_KEY                             (the model provider's key)
#   vars:    S3_BUCKET, CLOUDFRONT_DISTRIBUTION_ID, DEPLOY_HOST, SSH_HOST_KEY,
#            SITE_URL, LLM_PROVIDER, LLM_MODEL, LLM_CONTENT_MODEL, LLM_AUDIO_MODEL,
#            AUDIO_BUCKET, ALLOWED_ORIGINS (defaults to SITE_URL),
#            MAX_TOPICS_PER_HOUR, MAX_TOPICS_PER_USER, MAX_GENERATED_NODES_PER_HOUR,
#            MAX_MAP_PLANS_PER_HOUR, MAX_CARDS_WRITTEN_PER_HOUR, MAX_QUESTIONS_PER_HOUR,
#            MAX_NARRATIONS_PER_HOUR
#
# Every MAX_ variable is a generation ceiling per user per hour, and every one is
# off unless it is set. Set them on a deployment other people can register on —
# registration is open, and generation is what costs money.
#
# The audio half is optional: with AUDIO_BUCKET and the API_AWS_* secrets unset,
# every route still serves and the only thing that fails is the play button on a
# card, which says which variable is missing.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  S3_BUCKET: ${{ vars.S3_BUCKET }}
  CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
  DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
  APP: interestled
  API_HOST: api.interestled.com

jobs:
  # Cheap gate: a red typecheck or test must not reach production, and it costs
  # about a minute against a deploy that takes ten.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm lint

  deploy:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Export web app
        working-directory: apps/mobile
        env:
          # The API host itself, not the site: CloudFront gives an origin sixty
          # seconds and a map takes longer than that often enough to matter, so
          # a working generation came back as a 504 while the server carried on
          # and finished it. Nothing under /api is cacheable — the behaviour in
          # front of it has caching disabled — so the edge was adding a deadline
          # and nothing else. Going straight to Caddy costs a CORS preflight,
          # which is why ALLOWED_ORIGINS is now deployment configuration.
          EXPO_PUBLIC_API_URL: https://${{ env.API_HOST }}
        run: pnpm exec expo export --platform web --output-dir dist

      - name: Sync web app to S3
        run: |
          # Hashed assets are cached forever; the two HTML entry points must
          # always revalidate so a new deploy is picked up immediately.
          #
          # `downloads/*` is excluded from the delete as well: the Android APK
          # there is written by .github/workflows/android.yml and is no part of
          # this build, so a sync that owned the whole bucket would remove it
          # every time the web app shipped.
          aws s3 sync apps/mobile/dist "s3://$S3_BUCKET" \
            --delete \
            --exclude index.html \
            --exclude "android-install/*" \
            --exclude "downloads/*" \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 cp apps/mobile/dist/index.html "s3://$S3_BUCKET/index.html" \
            --cache-control "no-cache"
          # Copied from public/ by `expo export`. A tester who has seen this
          # page once must still get the current one, so it revalidates like
          # the app shell rather than being cached with the hashed assets.
          aws s3 cp apps/mobile/dist/android-install/index.html \
            "s3://$S3_BUCKET/android-install/index.html" \
            --cache-control "no-cache"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*"

      # Runs before the new code, so a deploy that adds a migration applies it.
      - name: Run database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm --filter server exec prisma migrate deploy

      - name: Build server bundle
        run: bash deployment/scripts/build-server.sh

      - name: Authorise SSH to the shared host
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST_KEY: ${{ vars.SSH_HOST_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Pinned, not accepted on first use: this key is what stops a hijacked
          # record from collecting a deploy key that can restart both APIs.
          # Recreating the instance changes it — re-read it with `ssh-keyscan`
          # and update the SSH_HOST_KEY variable when that happens.
          printf '%s\n' "$SSH_HOST_KEY" > ~/.ssh/known_hosts

      - name: Ship the API to the shared host
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_CONTENT_MODEL: ${{ vars.LLM_CONTENT_MODEL }}
          LLM_AUDIO_MODEL: ${{ vars.LLM_AUDIO_MODEL }}
          AUDIO_BUCKET: ${{ vars.AUDIO_BUCKET }}
          # Which sites' pages may call this API from a browser. Load-bearing
          # now that the web app is served from the site and talks to this host
          # directly: unset, the API allows only localhost and the deployed web
          # app is refused every request. www redirects to the apex before any
          # JavaScript runs, so the apex is the only origin a browser sends.
          ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS || vars.SITE_URL }}
          # Unset means no ceiling, which is what a single-learner deployment
          # wants: a build cut off at CloudFront's 60s still spends the hour's
          # nodes, so a ceiling turns a slow map into a refused retry.
          MAX_TOPICS_PER_HOUR: ${{ vars.MAX_TOPICS_PER_HOUR }}
          MAX_TOPICS_PER_USER: ${{ vars.MAX_TOPICS_PER_USER }}
          MAX_GENERATED_NODES_PER_HOUR: ${{ vars.MAX_GENERATED_NODES_PER_HOUR }}
          MAX_MAP_PLANS_PER_HOUR: ${{ vars.MAX_MAP_PLANS_PER_HOUR }}
          MAX_CARDS_WRITTEN_PER_HOUR: ${{ vars.MAX_CARDS_WRITTEN_PER_HOUR }}
          MAX_QUESTIONS_PER_HOUR: ${{ vars.MAX_QUESTIONS_PER_HOUR }}
          MAX_NARRATIONS_PER_HOUR: ${{ vars.MAX_NARRATIONS_PER_HOUR }}
          # The API's own key, not the deployer's above: it can put and get
          # objects in the audio bucket and nothing else in the account.
          API_AWS_ACCESS_KEY_ID: ${{ secrets.API_AWS_ACCESS_KEY_ID }}
          API_AWS_SECRET_ACCESS_KEY: ${{ secrets.API_AWS_SECRET_ACCESS_KEY }}
        run: |
          ssh_opts=(
            -i "$HOME/.ssh/id_deploy"
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            -o StrictHostKeyChecking=yes
          )

          # Staged beside the live directory and swapped, so systemd can never
          # restart into a half-transferred bundle.
          rsync -az --delete -e "ssh ${ssh_opts[*]}" \
            deployment/dist/server/ "deploy@$DEPLOY_HOST:/srv/$APP/next/"

          # Piped rather than passed as an argument: an argument is visible in
          # `ps` to anything else on the host for as long as the command runs.
          # This rewrites the file each deploy, so it is the workflow — not a
          # hand edit on the box — that decides what the service runs with.
          printf '%s\n' \
            "DATABASE_URL=$DATABASE_URL" \
            "LLM_PROVIDER=$LLM_PROVIDER" \
            "LLM_MODEL=$LLM_MODEL" \
            "LLM_CONTENT_MODEL=$LLM_CONTENT_MODEL" \
            "LLM_AUDIO_MODEL=$LLM_AUDIO_MODEL" \
            "GEMINI_API_KEY=$GEMINI_API_KEY" \
            "AUDIO_BUCKET=$AUDIO_BUCKET" \
            "ALLOWED_ORIGINS=$ALLOWED_ORIGINS" \
            "AWS_REGION=$AWS_REGION" \
            "AWS_ACCESS_KEY_ID=$API_AWS_ACCESS_KEY_ID" \
            "AWS_SECRET_ACCESS_KEY=$API_AWS_SECRET_ACCESS_KEY" \
            "MAX_TOPICS_PER_HOUR=$MAX_TOPICS_PER_HOUR" \
            "MAX_TOPICS_PER_USER=$MAX_TOPICS_PER_USER" \
            "MAX_GENERATED_NODES_PER_HOUR=$MAX_GENERATED_NODES_PER_HOUR" \
            "MAX_MAP_PLANS_PER_HOUR=$MAX_MAP_PLANS_PER_HOUR" \
            "MAX_CARDS_WRITTEN_PER_HOUR=$MAX_CARDS_WRITTEN_PER_HOUR" \
            "MAX_QUESTIONS_PER_HOUR=$MAX_QUESTIONS_PER_HOUR" \
            "MAX_NARRATIONS_PER_HOUR=$MAX_NARRATIONS_PER_HOUR" \
            | ssh "${ssh_opts[@]}" "deploy@$DEPLOY_HOST" "umask 077 && cat > /etc/$APP-api.env"

          ssh "${ssh_opts[@]}" "deploy@$DEPLOY_HOST" "
            set -euo pipefail
            rm -rf /srv/$APP/current
            mv /srv/$APP/next /srv/$APP/current
            sudo systemctl restart $APP-api
          "

      - name: Verify the API is serving
        run: |
          ssh_opts=(
            -i "$HOME/.ssh/id_deploy"
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            -o StrictHostKeyChecking=yes
          )

          # Against the origin rather than through CloudFront: this is the hop
          # the deploy actually changed, and it proves Caddy's certificate and
          # the service behind it in one request.
          for attempt in $(seq 1 12); do
            if curl -fsS --max-time 10 "https://$API_HOST/health"; then
              echo; echo "API is serving."
              exit 0
            fi
            echo "attempt $attempt: not serving yet"
            sleep 5
          done

          echo "::error::$APP-api did not come up. Last 60 log lines:"
          ssh "${ssh_opts[@]}" "deploy@$DEPLOY_HOST" \
            "systemctl is-active $APP-api || true; journalctl -u $APP-api -n 60 --no-pager"
          exit 1
